<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    h2 { font-size: 1.1rem; }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }
    p { color: var(--muted); font-size: 0.88rem; margin-bottom: 12px; }
    textarea {
      width: 100%;
      height: 225px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 0.82rem;
      resize: none;
      margin-bottom: 14px;
    }
    textarea:focus { outline: none; border-color: var(--primary); }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Importar Coletas</h2>
    <span class="badge">FRETES</span>
  </div>
  <p>Cole abaixo as linhas copiadas da aba <strong>COLETAS</strong>:</p>

  <textarea id="dadosColeta" placeholder="Ctrl + V aqui..."></textarea>
  <button id="btnEnviar" onclick="enviarDados()">Importar Dados</button>

  <script>
    function enviarDados() {
      const dados = document.getElementById('dadosColeta').value;
      if (!dados.trim()) {
        alert("Cole os dados antes de importar.");
        return;
      }

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.innerText = "Processando e salvando...";

      const id = 1; // No extra.html, troque para 2
      google.script.run
        .withSuccessHandler(() => {
          alert("Registros inseridos com sucesso!");
          google.script.host.close();
        })
        .withFailureHandler((err) => {
          alert("Erro ao importar: " + err.message);
          btn.disabled = false;
          btn.innerText = "Importar Dados";
        })
        .processarDadosColados(id, dados);
    }
  </script>
</body>
</html>
