<!DOCTYPE html>
<html>

<head>

<style>
  :root {
    --primary-color: #e3c0fb;
    --second-color: #bf72f3
  }

  body {
    font-family: Arial, sans-serif;
    padding: 15px;

  }

  button {
    padding: 10px 15px;

    color: white;

  }
</style>

<body>
  <h2>Confira as nf's registradas: </h2>

  <div id="results">

  </div>
  <!-- Guardamos o JSON de forma segura dentro de uma tag oculta -->
  <input type="hidden" id="dadosServidor" value='<?= dadosInjetados ?>'>

 <script>
    window.onload = function() {
      const dadosBrutos = document.getElementById('dadosServidor').value;
      const filtrado = JSON.parse(dadosBrutos);
      
      const div = document.getElementById('results');

      if (!filtrado || filtrado.length === 0) return;

      filtrado.forEach(linha => {
        const p = document.createElement("p");
        p.className = "item-nf";
        p.innerText = "NF: " + linha[0] + " | Evento: " + linha[1];
        div.appendChild(p);

        const btn = document.createElement("button");
        btn.className = "btn-link"; 
        btn.innerText = "Visualizar NF";
        
        btn.onclick = function() {
          const nfSelecionada = linha[0];
          
          google.script.run
            .withSuccessHandler(() => {
              google.script.host.close(); 
            }).encontrarNf(nfSelecionada); 
        }; // Fechamento correto do btn.onclick

        div.appendChild(btn);
      }); 
    };
  </script>
</body>

</html>
